<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4fb3ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Zoom Zoom Cars - a friendly car game for kids. Collect stars, grab nitro, unlock super cars and drive through eight lands!">
<title>Zoom Zoom Cars</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #4fb3ff;
    font-family: "Trebuchet MS", "Comic Sans MS", "Arial Rounded MT Bold", Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
  }
  #stage {
    position: relative;
    width: 400px;
    height: 640px;
    overflow: hidden;
    font-size: 16px;
    background: #5b6470;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.25);
    cursor: pointer;
  }
  canvas#game { display: block; width: 100%; height: 100%; }

  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4em;
    padding: 0.5em 0.6em;
    padding-top: calc(0.5em + env(safe-area-inset-top, 0px));
    pointer-events: none;
  }
  .pill {
    background: rgba(255, 255, 255, 0.92);
    color: #1f2937;
    border-radius: 999px;
    padding: 0.25em 0.7em;
    font-weight: bold;
    font-size: 1.1em;
    box-shadow: 0 0.15em 0 rgba(0, 0, 0, 0.2);
    white-space: nowrap;
  }
  #score.gold { background: #ffd21f; animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.1); } }
  #hearts.small { font-size: 0.9em; }
  #level {
    position: absolute;
    left: 0.6em;
    top: calc(3.5em + env(safe-area-inset-top, 0px));
    font-size: 0.9em;
    background: rgba(31, 41, 55, 0.75);
    color: #fff;
    pointer-events: none;
  }
  #hudButtons { display: flex; gap: 0.4em; }
  .iconBtn {
    pointer-events: auto;
    width: 2.3em; height: 2.3em;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    font-size: 1.1em;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    box-shadow: 0 0.15em 0 rgba(0, 0, 0, 0.2);
    font-family: inherit;
  }

  #banner {
    position: absolute;
    top: 19%;
    left: 50%;
    max-width: 94%;
    transform: translate(-50%, -0.6em) scale(0.8);
    background: rgba(255, 255, 255, 0.95);
    color: #1f2937;
    border-radius: 1.3em;
    padding: 0.3em 0.9em;
    font-size: 1.35em;
    font-weight: bold;
    width: max-content;
    text-align: center;
    line-height: 1.2;
    box-shadow: 0 0.15em 0 rgba(0, 0, 0, 0.25);
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  #banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  .arrow {
    position: absolute;
    bottom: calc(1.2% + env(safe-area-inset-bottom, 0px));
    width: 15%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.45);
    color: #1f2937;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.7em;
    pointer-events: none;
  }
  #arrowL { left: 1.5%; }
  #arrowR { right: 1.5%; }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
    padding: 1em;
    text-align: center;
    background: rgba(20, 60, 110, 0.6);
    color: #fff;
    cursor: default;
  }
  #overlay h1 {
    margin: 0;
    font-size: 2.2em;
    line-height: 1.1;
    text-shadow: 0 0.08em 0 rgba(0, 0, 0, 0.3);
  }
  #overlay p { margin: 0; font-size: 1.05em; line-height: 1.3; }
  #scoreLine { font-size: 1.45em !important; font-weight: bold; }
  #carName { font-size: 1.25em !important; font-weight: bold; }
  #trait { font-size: 1em !important; font-weight: bold; color: #ffe98a; min-height: 1.3em; }
  #nextLine { font-size: 0.95em !important; opacity: 0.95; }
  #hint { font-size: 0.9em !important; opacity: 0.9; }
  #buttons { display: flex; flex-wrap: wrap; gap: 0.6em; justify-content: center; }
  .bigBtn {
    border: none;
    border-radius: 999px;
    background: #ffd21f;
    color: #1f2937;
    font-family: inherit;
    font-weight: bold;
    font-size: 1.4em;
    padding: 0.45em 1em;
    cursor: pointer;
    box-shadow: 0 0.22em 0 #c99a00;
  }
  .bigBtn:active { transform: translateY(0.12em); box-shadow: 0 0.1em 0 #c99a00; }
  #raceBtn { background: #ff8a3d; box-shadow: 0 0.22em 0 #c75a14; }
  #raceBtn:active { box-shadow: 0 0.1em 0 #c75a14; }
  .bigBtn:disabled, #raceBtn:disabled { background: #b8c0cc; box-shadow: 0 0.22em 0 #8892a0; cursor: default; }
  #langBtn {
    position: absolute;
    top: calc(3.6em + env(safe-area-inset-top, 0px));
    right: 0.6em;
    border: none;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    color: #1f2937;
    font-family: inherit;
    font-weight: bold;
    font-size: 0.95em;
    padding: 0.35em 0.8em;
    cursor: pointer;
    box-shadow: 0 0.15em 0 rgba(0, 0, 0, 0.25);
  }
  #garage { display: flex; align-items: center; justify-content: center; gap: 0.7em; }
  #carView {
    width: 7em; height: 9em;
    border-radius: 1em;
    border: 0.2em solid #fff;
    background: rgba(255, 255, 255, 0.28);
  }
  .navBtn {
    width: 2.6em; height: 2.6em;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.92);
    color: #1f2937;
    font-size: 1.2em;
    font-family: inherit;
    padding: 0;
    cursor: pointer;
    box-shadow: 0 0.15em 0 rgba(0, 0, 0, 0.25);
  }
  #colors { display: flex; gap: 0.6em; justify-content: center; }
  .swatch {
    width: 2.4em; height: 2.4em;
    border-radius: 50%;
    border: 0.22em solid rgba(255, 255, 255, 0.5);
    cursor: pointer;
    padding: 0;
  }
  .swatch.on { border-color: #fff; transform: scale(1.18); box-shadow: 0 0 0 0.2em rgba(0, 0, 0, 0.25); }
  .hidden { display: none !important; }
  button:focus-visible { outline: 0.2em solid #fff; outline-offset: 0.15em; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="400" height="640"></canvas>

  <div id="hud">
    <div class="pill" id="score">⭐ 0</div>
    <div class="pill" id="hearts">❤️❤️❤️</div>
    <div id="hudButtons">
      <button class="iconBtn" id="muteBtn" aria-label="Sound on or off">🔊</button>
      <button class="iconBtn" id="pauseBtn" aria-label="Pause">⏸</button>
    </div>
  </div>
  <div class="pill" id="level">Level 1</div>

  <div id="banner"></div>

  <div class="arrow" id="arrowL">◀</div>
  <div class="arrow" id="arrowR">▶</div>

  <div id="overlay">
    <button id="langBtn" aria-label="Change language">Ελληνικά</button>
    <h1 id="title">🚗 Zoom Zoom Cars</h1>
    <p id="message">Collect ⭐ stars and power-ups!<br>Steer around traffic on the twisty road.</p>
    <p id="scoreLine" class="hidden"></p>
    <div id="garage">
      <button class="navBtn" id="prevBtn" aria-label="Previous vehicle">◀</button>
      <canvas id="carView" width="168" height="216"></canvas>
      <button class="navBtn" id="nextBtn" aria-label="Next vehicle">▶</button>
    </div>
    <p id="carName"></p>
    <p id="trait"></p>
    <div id="colors"></div>
    <div id="buttons">
      <button class="bigBtn" id="playBtn">▶ Play</button>
      <button class="bigBtn" id="raceBtn">🏁 Race 1</button>
    </div>
    <p id="nextLine"></p>
    <p id="hint">Tap the left or right side to steer · or use ← → keys</p>
  </div>
</div>

<script>

      z_city: 'Night City', z_space: 'Rainbow Space', z_volcano: 'Volcano Valley', z_candy: 'Candy Land',

  var RN = [];
  for (var ri = 0; ri < 480; ri++) RN.push(Math.random());

  function $(id) { return document.getElementById(id); }

  var prevBtn = $('prevBtn'), nextBtn = $('nextBtn'), raceBtn = $('raceBtn'), langBtn = $('langBtn');
  var arrowL = $('arrowL'), arrowR = $('arrowR');

  // ---------- Safe storage ----------
  function load(key, fallback) {
    try {
      var v = window.localStorage.getItem(key);
      return v === null ? fallback : v;
    } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { window.localStorage.setItem(key, String(value)); } catch (e) { /* ignore */ }
  }
  function loadIndex(key, count) {
    var n = parseInt(load(key, '0'), 10) || 0;
    return (n < 0 || n >= count) ? 0 : n;
  }

  var best = parseInt(load('zzc_best', '0'), 10) || 0;
  if (best < 0) best = 0;
  var muted = load('zzc_muted', '0') === '1';
  var raceWon = parseInt(load('zzc_race', '0'), 10) || 0;
  if (raceWon < 0) raceWon = 0;
  var navLang = (navigator.language || 'en').toLowerCase().indexOf('el') === 0 ? 'el' : 'en';
  lang = load('zzc_lang', navLang) === 'el' ? 'el' : 'en';
  var colorIndex = loadIndex('zzc_color', CAR_COLORS.length);
  var vehicleIndex = loadIndex('zzc_vehicle2', PLAYER_VEHICLES.length);
  if (PLAYER_VEHICLES[vehicleIndex].unlock > best) vehicleIndex = 0;
  var viewIndex = vehicleIndex;

  var player = { kind: 'car', lane: 1, x: laneX(1), y: H - 130, w: 54, h: 92 };
  var entities = [], particles = [], popups = [], scenery = [];
  var elapsed = 0, distance = 0, bonus = 0, score = 0, combo = 0;
  var hearts = 3, maxHearts = 3;
  var speed = 300, speedMul = 1, rowTimer = 0, safeLane = 1, rowsSincePower = 0;
  var invincible = 0, shake = 0, overAt = 0, camX = 0, camLane = 0, clock = 0;
  var starSpeed = 0, slow = 0, lastOverlay = 'menu', ptr = null;
  // race mode
  var mode = 'endless', raceLevel = 1, raceLen = 0, raceBase = 330, raceBoost = 0, raceResult = null, bot = null;
  var nitro = 0, nitroFull = 3, magnet = 0, dbl = 0, shield = false;
  var nitroDur = 3, magnetDur = 7, dblDur = 8, squash = false, starMult = 1, freeNitro = false, freeShield = false;
  // lands and levels
  var seq = [0, 1, 2, 3], seqPos = 0, cp = 0, level = 1;
  var zoneBelow = 0, zoneAbove = 0, zoneNow = 0, transitioning = false, announced = true, boundaryY = 0;
  var zoneStart = 0, nextZoneAt = ZONE_BASE;
  // high score and unlocks
  var bestAtStart = 0, hsHit = false, unlockCount = 0, runUnlocked = [], fireworksAt = -99;
  // banner queue
  var bannerQueue = [], bannerFreeAt = 0, bannerTimer = 0;

  var scaleX = 1, scaleY = 1, lastTime = 0;
  var shownScore = -1, shownHearts = '', shownLevel = '', shownGold = null;
  var stripOff = [];

  function laneX(i) { return ROAD_X + LANE_W * i + LANE_W / 2; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function mod(a, n) { return ((a % n) + n) % n; }

  // ---------- The bendy road ----------
  // curve(worldY) is how far the road centre has swung sideways at that point.
  function curve(wy) {
    var amp = clamp((wy - 1200) / 120, 0, 130);
    return amp * (Math.sin(wy / 700) * 0.6 + Math.sin(wy / 310 + 1) * 0.4);
  }
  function worldY(sy) { return distance + player.y - sy; }
  function offAt(sy) { return curve(worldY(sy)) - camX; }
  function angleAt(sy) {
    var wy = worldY(sy);
    return Math.atan((curve(wy + 6) - curve(wy - 6)) / 12);
  }
  // The view is locked to the road right under the car, so bends never make the car
  // drift on screen. It only eases gently sideways when the car changes lane.
  function updateCamera(dt) {
    camLane += ((player.x - W / 2) * 0.7 - camLane) * Math.min(1, dt * 6);
    camX = curve(distance) + camLane;
  }

  // ---------- Sound ----------
  var actx = null;
  function beep(freq, dur, type, vol, slideTo, delay) {
    if (muted) return;
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state === 'suspended') actx.resume();
      var t = actx.currentTime + (delay || 0);
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol || 0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g);
      g.connect(actx.destination);
      o.start(t);
      o.stop(t + dur + 0.02);
    } catch (e) { /* sound is optional */ }
  }
  function tune(notes, type, vol, step) {
    for (var i = 0; i < notes.length; i++) beep(notes[i], i === notes.length - 1 ? 0.3 : 0.12, type, vol, null, i * step);
  }
  function sndStar() { beep(880 + Math.min(combo, 10) * 30, 0.1, 'sine', 0.12); beep(1320 + Math.min(combo, 10) * 30, 0.15, 'sine', 0.12, null, 0.08); }
  function sndGem() { tune([1047, 1319, 1568, 2093], 'sine', 0.1, 0.06); }
  function sndBump() { beep(220, 0.25, 'triangle', 0.2, 90); }
  function sndMove() { beep(520, 0.05, 'sine', 0.05); }
  function sndStart() { tune([523, 659, 784], 'square', 0.06, 0.1); }
  function sndOver() { tune([659, 523, 784], 'sine', 0.12, 0.15); }
  function sndNitro() { beep(180, 0.5, 'sawtooth', 0.08, 900); }
  function sndPower() { tune([523, 784, 1047], 'sine', 0.12, 0.08); }
  function sndWhoosh() { beep(700, 0.18, 'triangle', 0.1, 250); }
  function sndPop() { beep(400, 0.12, 'square', 0.07, 900); }
  function sndZone() { tune([523, 659, 784, 1047], 'triangle', 0.12, 0.12); }
  function sndUnlock() { tune([784, 988, 1175, 1568], 'square', 0.06, 0.1); }
  function sndHighScore() { tune([523, 659, 784, 1047, 784, 1047, 1319], 'triangle', 0.13, 0.11); }
  function buzz(ms) {
    try {
      var ua = navigator.userActivation;
      if (navigator.vibrate && (!ua || ua.hasBeenActive)) navigator.vibrate(ms);
    } catch (e) { /* optional */ }
  }

  // ---------- Banner ----------
  function putBanner(text) {
    elBanner.textContent = text;
    elBanner.classList.add('show');
    window.clearTimeout(bannerTimer);
    bannerTimer = window.setTimeout(function () { elBanner.classList.remove('show'); }, 1500);
  }
  // Important banners wait their turn; small ones only show when nothing else is up.
  function showBanner(text, important, isLevel) {
    if (important) {
      // a newer level banner replaces one that is still waiting
      if (isLevel) bannerQueue = bannerQueue.filter(function (b) { return !b.lvl; });
      if (bannerQueue.length < 4) bannerQueue.push({ text: text, lvl: !!isLevel });
    } else if (!bannerQueue.length && performance.now() >= bannerFreeAt) {
      putBanner(text);
    }
  }
  function pumpBanners(now) {
    if (bannerQueue.length && now >= bannerFreeAt && state === 'playing') {
      putBanner(bannerQueue.shift().text);
      bannerFreeAt = now + 1700;
    }
  }

  // ---------- Unlocks ----------
  function countUnlocked(b) {
    var n = 0;
    for (var i = 0; i < UNLOCKS.length; i++) if (UNLOCKS[i].score <= b) n++;
    return n;
  }
  function nextUnlockText() {
    for (var i = 0; i < UNLOCKS.length; i++) {
      if (UNLOCKS[i].score > best) return '🔓 ' + T('nextUnlock', { s: UNLOCKS[i].score, n: unlockName(UNLOCKS[i]) });
    }
    return T('allUnlocked');
  }

  // ---------- Setup ----------
  function sceneType(zoneIndex, left) {
    var z = ZONES[zoneIndex];
    return pick(left ? z.sceneL : z.sceneR);
  }

  function initScenery() {
    scenery = [];
    for (var i = 0; i < SCENERY_COUNT; i++) {
      var left = i % 2 === 0;
      scenery.push({
        left: left,
        dist: (i % 4 < 2) ? rand(20, 30) : rand(66, 84),   // a near row and a far row
        y: i * SCENERY_GAP - 160 + rand(-8, 8),
        type: sceneType(zoneAbove, left),
        s: Math.random()
      });
    }
  }

  function applyVehicle() {
    var v = PLAYER_VEHICLES[vehicleIndex];
    player.kind = v.kind;
    player.w = VEH[v.kind].w;
    player.h = VEH[v.kind].h;
    maxHearts = v.hearts;
    nitroDur = v.kind === 'racer' ? 4.5 : 3;
    magnetDur = v.kind === 'car' ? 11 : 7;
    squash = v.kind === 'monster';
    freeNitro = v.kind === 'superc';
    freeShield = v.kind === 'rocket';
    starMult = v.kind === 'gold' ? 2 : 1;
  }

  function zoneLenFor(n) { return mode === 'race' ? 8000 : Math.min(18000, ZONE_BASE + 1500 * n); }

  function resetGame() {
    applyVehicle();
    entities = []; particles = []; popups = [];
    elapsed = 0; distance = 0; bonus = 0; score = 0; combo = 0; hearts = maxHearts;
    speed = 300; speedMul = 1; rowTimer = 220; safeLane = 1; rowsSincePower = 3;
    invincible = 0; shake = 0; camX = 0; camLane = 0;
    nitro = 0; magnet = 0; dbl = 0; shield = false;
    starSpeed = 0; slow = 0; raceBoost = 0; raceResult = null; bot = null; ptr = null;
    // the journey: every land unlocked so far, in order
    seq = [];
    for (var i = 0; i < ZONES.length; i++) if (ZONES[i].unlock <= best) seq.push(i);
    seqPos = 0; cp = 0; level = 1;
    zoneBelow = seq[0]; zoneAbove = seq[0]; zoneNow = seq[0];
    transitioning = false; announced = true;
    zoneStart = 0; nextZoneAt = zoneLenFor(0);
    bestAtStart = best; hsHit = false; fireworksAt = -99;
    unlockCount = countUnlocked(best); runUnlocked = [];
    bannerQueue = []; bannerFreeAt = 0;
    player.lane = 1;
    player.x = laneX(1);
    initScenery();
    updateHud(true);
  }

  // ---------- Garage (vehicle picker) ----------
  function drawGarage() {
    var v = PLAYER_VEHICLES[viewIndex];
    var locked = v.unlock > best;
    var c = carView.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, carView.width, carView.height);
    c.setTransform(1.45, 0, 0, 1.45, carView.width / 2, carView.height / 2);
    c.globalAlpha = locked ? 0.3 : 1;
    drawVehicle(c, v.kind, CAR_COLORS[colorIndex], true);
    c.globalAlpha = 1;
    if (locked) {
      c.strokeStyle = '#ffffff'; c.lineWidth = 6;
      c.beginPath(); c.arc(0, -6, 11, Math.PI, 0); c.stroke();
      fillRR(c, '#ffffff', -18, -6, 36, 28, 6);
      disc(c, '#1f2937', 0, 6, 4);
      c.fillStyle = '#1f2937'; c.fillRect(-1.5, 6, 3, 9);
    }
    elCarName.textContent = T('v_' + v.kind);
    elTrait.textContent = locked ? T('scoreToUnlock', { s: v.unlock }) : T('t_' + v.kind);
    if (state !== 'paused') {
      playBtn.disabled = locked;
      raceBtn.disabled = locked;
      playBtn.textContent = locked ? T('locked') : T('play');
      raceBtn.textContent = '🏁 ' + T('raceWord') + ' ' + (raceWon + 1);
    }
  }

  function turnGarage(dir) {
    viewIndex = mod(viewIndex + dir, PLAYER_VEHICLES.length);
    if (PLAYER_VEHICLES[viewIndex].unlock <= best) {
      vehicleIndex = viewIndex;
      save('zzc_vehicle2', vehicleIndex);
    }
    drawGarage();
    beep(660, 0.08, 'sine', 0.08);
  }

  function buildPickers() {
    prevBtn.addEventListener('click', function () { turnGarage(-1); });
    nextBtn.addEventListener('click', function () { turnGarage(1); });
    CAR_COLORS.forEach(function (col, i) {
      var b = document.createElement('button');
      b.className = 'swatch' + (i === colorIndex ? ' on' : '');
      b.style.background = col;
      b.setAttribute('aria-label', 'Colour ' + (i + 1));
      b.addEventListener('click', function () {
        colorIndex = i;
        save('zzc_color', i);
        var all = elColors.children;
        for (var k = 0; k < all.length; k++) all[k].classList.toggle('on', k === i);
        drawGarage();
        beep(660, 0.08, 'sine', 0.08);
      });

    });

  function resize() {
    var vw = window.innerWidth || document.documentElement.clientWidth;
    var vh = window.innerHeight || document.documentElement.clientHeight;
    if (vw < 1 || vh < 1) return;
    // Fill tall phone screens, but never get wider than a 400:640 portrait shape.
    var w = Math.min(vw, vh * 0.625);
    var h = Math.min(vh, w * 2.3);
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    stage.style.fontSize = (w / 25) + 'px';
    H = W * h / w;
    player.y = H - 130;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    scaleX = canvas.width / W;
    scaleY = canvas.height / H;
    draw();
  }

  // ---------- Screens ----------
  function showOverlay(kind) {
    lastOverlay = kind;
    elOverlay.classList.remove('hidden');
    var showPicker = kind !== 'paused';
    elGarage.classList.toggle('hidden', !showPicker);
    elCarName.classList.toggle('hidden', !showPicker);
    elTrait.classList.toggle('hidden', !showPicker);
    elColors.classList.toggle('hidden', !showPicker);
    elNextLine.classList.toggle('hidden', !showPicker);
    raceBtn.classList.toggle('hidden', !showPicker);
    elHint.classList.toggle('hidden', kind !== 'menu');
    elScoreLine.classList.toggle('hidden', kind !== 'over');
    elMessage.classList.toggle('hidden', kind === 'paused');

    elHint.textContent = T('hint');
    if (kind === 'menu') {
      elTitle.textContent = T('title');
      elMessage.innerHTML = T('msg');

    } else if (kind === 'paused') {
      elTitle.textContent = T('paused');
      playBtn.disabled = false;
      playBtn.textContent = T('keepGoing');
    } else if (mode === 'race') {
      elTitle.textContent = raceResult ? T('win') : T('lose');

      elMessage.textContent = raceResult ? T('winMsg', { n: raceLevel }) : T('loseMsg');
      elNextLine.textContent = nextUnlockText();
    } else {
      var isBest = score > 0 && score > bestAtStart;
      elTitle.textContent = isBest ? T('newHigh') : T('great');
      elScoreLine.textContent = score + ' ⭐ · ' + T('level') + ' ' + level;
      elMessage.textContent = runUnlocked.length
        ? T('unlockedList', { n: runUnlocked.map(unlockName).join(', ') })
        : (isBest ? T('bestEver') : T('bestScore', { s: best }));
      elNextLine.textContent = nextUnlockText();
    }
    if (showPicker) drawGarage();
    elBanner.classList.remove('show');
    arrowL.classList.add('hidden');
    arrowR.classList.add('hidden');

  function hideOverlay() {
    elOverlay.classList.add('hidden');

    arrowR.classList.remove('hidden');
    pauseBtn.classList.remove('hidden');
    elLevel.classList.remove('hidden');

  function setLang(next) {
    lang = next;
    save('zzc_lang', lang);
    document.documentElement.lang = lang;
    document.title = T('title').replace('🚗 ', '');
    showOverlay(lastOverlay);
    updateHud(true);
  }

  function startGame(newMode) {
    if (PLAYER_VEHICLES[viewIndex].unlock > best) return;
    vehicleIndex = viewIndex;
    mode = newMode === 'race' ? 'race' : 'endless';
    resetGame();
    state = 'playing';
    hideOverlay();
    sndStart();
    if (mode === 'race') {
      raceLevel = raceWon + 1;
      level = raceLevel;
      raceBase = 330 + Math.min(300, 14 * (raceLevel - 1));
      raceLen = 22000 + 2500 * Math.min(raceLevel - 1, 8);
      // the rival starts a little ahead, so the race begins as a chase
      bot = { dist: 450, lane: 1, x: laneX(1), slow: 0, cool: 0, playerAhead: false,
        speed: raceBase + 55 + Math.min(40, 5 * (raceLevel - 1)),
