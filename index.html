  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';
    ptr = null;
    save('zzc_best', best);
    showOverlay('paused');
  }

  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing';
    hideOverlay();
  }

  // true while the end screen should throw a party
  function celebrating() {
    if (state !== 'over') return false;
    return mode === 'race' ? raceResult === true : (score > 0 && score > bestAtStart);
  }

  function endGame() {
    state = 'over';
    ptr = null;
    overAt = performance.now();
    save('zzc_best', best);
    showOverlay('over');
    if (celebrating()) sndHighScore(); else sndOver();
  }

  function pressPlay(newMode) {
    if (state === 'paused') { resumeGame(); return; }
    if (state === 'over' && performance.now() - overAt < 600) return; // avoid accidental restart
    if (state === 'menu' || state === 'over') startGame(newMode);
  }

  function updateHud(force) {
    if (force || score !== shownScore) {
      shownScore = score;
      elScore.textContent = '⭐ ' + score;
    }
    if (force || hsHit !== shownGold) {
      shownGold = hsHit;
      elScore.classList.toggle('gold', hsHit);
    }
    var h;
    if (mode === 'race' && bot) {
      h = distance >= bot.dist ? T('first') : T('second');     // your place in the race
    } else {
      h = '';
      for (var i = 0; i < maxHearts; i++) h += i < hearts ? '❤️' : '🤍';
    }
    if (force || h !== shownHearts) {
      shownHearts = h;
      elHearts.textContent = h;
      elHearts.classList.toggle('small', mode !== 'race' && maxHearts >= 5);
    }
    var kmh = Math.round(speed / 3 / 5) * 5;
    var l = (mode === 'race' ? T('raceWord') + ' ' + raceLevel : T('level') + ' ' + level) + ' · ' + kmh + ' ' + T('kmh');
    if (force || l !== shownLevel) {
      shownLevel = l;
      elLevel.textContent = l;
    }
  }

  // ---------- Input ----------
  function steer(dir) {
    if (state !== 'playing') return;
    var next = clamp(player.lane + dir, 0, 2);
    if (next !== player.lane) {
      player.lane = next;
      sndMove();
    }
  }

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
      if (state === 'playing') steer(-1); else if (state !== 'paused') turnGarage(-1);
      e.preventDefault();
    } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
      if (state === 'playing') steer(1); else if (state !== 'paused') turnGarage(1);
      e.preventDefault();
    } else if (k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
    } else if (k === ' ' || k === 'Enter') {
      if (e.repeat) { e.preventDefault(); return; }
      if (state !== 'playing') {
        // Let a focused picker or icon button handle its own click.
        var t = e.target;
        if (t && t !== playBtn && t.tagName === 'BUTTON') return;
        pressPlay('endless');
      }
      e.preventDefault();
    } else if (k === 'p' || k === 'P' || k === 'Escape') {
      if (state === 'playing') pauseGame(); else if (state === 'paused') resumeGame();
    }
  });

  // Touch and mouse: a quick tap on the left or right side moves one lane,
  // and sliding a finger sideways moves the car one lane per short slide.
  stage.addEventListener('pointerdown', function (e) {
    if (state !== 'playing') return;
    if (e.target && e.target.closest && e.target.closest('button')) return;
    ptr = { id: e.pointerId, x: e.clientX, moved: false };
    e.preventDefault();
  });
  window.addEventListener('pointermove', function (e) {
    if (!ptr || e.pointerId !== ptr.id || state !== 'playing') return;
    var step = Math.max(24, stage.getBoundingClientRect().width * 0.13);
    while (e.clientX - ptr.x >= step) { steer(1); ptr.x += step; ptr.moved = true; }
    while (ptr.x - e.clientX >= step) { steer(-1); ptr.x -= step; ptr.moved = true; }
  });
  window.addEventListener('pointerup', function (e) {
    if (!ptr || e.pointerId !== ptr.id) return;
    if (!ptr.moved && state === 'playing') {
      var r = stage.getBoundingClientRect();
      steer((e.clientX - r.left) < r.width / 2 ? -1 : 1);
    }
    ptr = null;
  });
  window.addEventListener('pointercancel', function () { ptr = null; });

  // Stop the page from scrolling / zooming while playing on phones.
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  playBtn.addEventListener('click', function () { pressPlay('endless'); playBtn.blur(); });
  raceBtn.addEventListener('click', function () { pressPlay('race'); raceBtn.blur(); });
  langBtn.addEventListener('click', function () { setLang(lang === 'en' ? 'el' : 'en'); langBtn.blur(); });
  pauseBtn.addEventListener('click', function () { pauseGame(); pauseBtn.blur(); });
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    save('zzc_muted', muted ? '1' : '0');
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (!muted) beep(660, 0.08, 'sine', 0.08);
    muteBtn.blur();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pauseGame();
  });
  window.addEventListener('blur', pauseGame);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { window.setTimeout(resize, 200); });

  // ---------- Game logic ----------
  function spawnRow() {
    // The "safe lane" wanders by at most one lane per row, so there is
    // always a clear path that needs no more than one lane change.
    safeLane = clamp(safeLane + pick([-1, 0, 1]), 0, 2);
    var others = [0, 1, 2].filter(function (l) { return l !== safeLane; });
    if (Math.random() < 0.5) others.reverse();
    var lvl = mode === 'race' ? Math.min(6, raceLevel + 1) : cp + 1;

    var blocked = [];
    if (elapsed > 1.5) {
      blocked.push(others[0]);
      // higher levels block two lanes more often
      var p2 = lvl < 2 ? (elapsed > 15 ? 0.2 : 0) : Math.min(0.62, 0.2 + 0.07 * lvl);
      if (Math.random() < p2) blocked.push(others[1]);
    }

    blocked.forEach(function (lane) {
      if (Math.random() < 0.3) {
        entities.push({ type: 'block', skin: ZONES[zoneAbove].block, lane: lane, x: laneX(lane), y: -90, w: 44, h: 44 });
      } else {
        var kind = pick(TRAFFIC_KINDS);
        entities.push({ type: 'veh', kind: kind, lane: lane, x: laneX(lane), y: -90,
          w: VEH[kind].w, h: VEH[kind].h, color: pick(TRAFFIC_COLORS), rot: 0 });
      }
    });

    var free = [0, 1, 2].filter(function (l) { return blocked.indexOf(l) === -1; });
    var lane = pick(free);
    rowsSincePower++;
    if (rowsSincePower >= 6 && Math.random() < 0.4) {
      rowsSincePower = 0;
      var ptype = pick(['nitro', 'nitro', 'nitro', 'shield', 'shield', 'magnet', 'magnet', 'dbl', 'dbl', 'heart', 'heart']);
      if (ptype === 'heart' && hearts >= maxHearts) ptype = 'nitro';
      if (ptype === 'shield' && shield) ptype = 'magnet';
      entities.push({ type: 'power', ptype: ptype, lane: lane, x: laneX(lane), y: -90, w: 44, h: 44 });
      return;
    }
    var r = Math.random();
    if (lvl >= 3 && r < 0.09) {
      entities.push({ type: 'pad', lane: lane, x: laneX(lane), y: -90, w: 60, h: 60 });      // speed pad
    } else if (lvl >= 2 && r < 0.18) {
      entities.push({ type: 'gem', lane: lane, x: laneX(lane), y: -90, w: 40, h: 40 });      // rare gem
    } else if (r < 0.85) {
      var count = Math.random() < 0.25 ? 3 : 1; // sometimes a little trail of stars
      for (var i = 0; i < count; i++) {
        entities.push({ type: 'star', lane: lane, x: laneX(lane), y: -90 - i * 70, w: 40, h: 40 });
      }
    }
  }

  function sx(e) { return e.x + offAt(e.y); }   // where something on the road is on screen

  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, Math.PI * 2), v = rand(60, 200);
      particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.6), max: 0.6, color: color, r: rand(3, 6), g: 0 });
    }
  }

  function confetti(x, y, n) {
    for (var i = 0; i < n; i++) {
      var a = rand(-Math.PI, 0), v = rand(120, 420);
      particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.9, 1.6), max: 1.6,
        color: 'hsl(' + Math.floor(rand(0, 360)) + ',95%,62%)', r: rand(3, 6), g: 500, rect: true });
    }
  }

  function popup(x, y, text) {
    if (popups.length < 12) popups.push({ x: x, y: y, text: text, life: 0.8 });
  }

  function fling(e) {
    e.fling = true;
    var dir = e.lane === 0 ? -1 : (e.lane === 2 ? 1 : (Math.random() < 0.5 ? -1 : 1));
    e.vx = dir * rand(380, 520);
    e.spin = dir * rand(5, 9);
    e.rot = e.rot || 0;
  }

  function startNitro(seconds) {
    if (seconds > nitro) { nitro = seconds; nitroFull = seconds; }
    sndNitro();
  }

  function applyPower(ptype) {
    showBanner(T('p_' + ptype), false);
    if (ptype === 'nitro') { startNitro(nitroDur); return; }
    sndPower();
    if (ptype === 'shield') shield = true;
    else if (ptype === 'magnet') magnet = magnetDur;
    else if (ptype === 'dbl') dbl = dblDur;
    else if (ptype === 'heart') {
      if (hearts < maxHearts) hearts++; else bonus += 25;
    }
  }

  // Super cars get a present at the start of every level.
  function grantLevelGifts() {
    if (freeNitro) startNitro(2);
    if (freeShield) shield = true;
  }

  function scrollScenery(dy) {
    var wrap = SCENERY_COUNT * SCENERY_GAP;
    for (var i = 0; i < scenery.length; i++) {
      var s = scenery[i];
      s.y += dy;
      if (s.y > H + 50) {
        s.y -= wrap;
        while (s.y > -40) s.y -= SCENERY_GAP; // always re-enter from above the screen
        s.type = sceneType(zoneAbove, s.left);
        s.s = Math.random();
      }
    }
  }

  function updateZones(dy) {
    if (!transitioning && distance >= nextZoneAt) {
      transitioning = true;
      announced = false;
      cp++;
      zoneStart = distance;
      nextZoneAt = distance + zoneLenFor(cp);
      seqPos = (seqPos + 1) % seq.length;
      zoneAbove = seq[seqPos];
      boundaryY = -30;
      // Anything still waiting above the screen belongs to the new land.
      for (var i = 0; i < scenery.length; i++) {
        if (scenery[i].y < boundaryY) scenery[i].type = sceneType(zoneAbove, scenery[i].left);
      }
    }
    if (transitioning) {
      boundaryY += dy;
      if (!announced && boundaryY >= player.y) {
        announced = true;
        zoneNow = zoneAbove;
        sndZone();
        if (mode === 'race') {
          showBanner(zoneName(ZONES[zoneNow]), true, true);
        } else {
          level = cp + 1;
          bonus += 40 + 10 * level;
          showBanner(T('level') + ' ' + level + ' · ' + zoneName(ZONES[zoneNow]), true, true);
          confetti(player.x + offAt(player.y), player.y - 40, 26);
          popup(player.x + offAt(player.y), player.y - 70, '+' + (40 + 10 * level));
          grantLevelGifts();
        }
      }
      if (boundaryY > H + 40) {
        transitioning = false;
        zoneBelow = zoneAbove;
      }
    }
  }

  function zoneProgress() {
    return clamp((distance - zoneStart) / Math.max(1, nextZoneAt - zoneStart), 0, 1);
  }

  function checkRecords() {
    if (mode === 'race' || score <= best) return;
    best = score;
    if (!hsHit && bestAtStart > 0) {
      hsHit = true;
      fireworksAt = clock;
      showBanner(T('newHigh'), true);
      confetti(W / 2, H * 0.45, 60);
      sndHighScore();
    }
    var n = countUnlocked(best);
    if (n > unlockCount) {
      for (var i = unlockCount; i < n; i++) {
        runUnlocked.push(UNLOCKS[i]);
        showBanner(T('unlockedBanner', { n: unlockName(UNLOCKS[i]) }), true);
      }
      unlockCount = n;
      save('zzc_best', best);
      confetti(W / 2, H * 0.45, 40);
      sndUnlock();
    }
  }

  function updateParticles(dt, dy) {
    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(j, 1); continue; }
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt + dy * 0.5;
    }
    for (var k = popups.length - 1; k >= 0; k--) {
      popups[k].life -= dt;
      popups[k].y -= 50 * dt;
      if (popups[k].life <= 0) popups.splice(k, 1);
    }
  }

  function loseHeart(e, i) {
    hearts--;
    combo = 0;
    starSpeed = Math.max(0, starSpeed - 30);
    invincible = 1.6;
    shake = 0.3;
    burst(sx(e), e.y, '#ffffff', 12);
    sndBump();
    buzz(60);
    entities.splice(i, 1);
  }

  // In a race a bump costs speed instead of a heart.
  function raceBump(e, i) {
    combo = 0;
    slow = 1;
    raceBoost = Math.max(0, raceBoost - 30);
    invincible = 1.4;
    shake = 0.3;
    burst(sx(e), e.y, '#ffffff', 12);
    sndBump();
    buzz(60);
    entities.splice(i, 1);
  }

  // The rival: drives by itself, looks ahead and changes lane around obstacles.
  function updateBot(dt) {
    var b = bot, i, e, g;
    var lead = b.dist - distance;
    var rubber = lead > 700 ? 0.9 : (lead < -700 ? 1.08 : 1);   // keeps the race close
    if (b.slow > 0) b.slow -= dt;
    b.dist += b.speed * rubber * (b.slow > 0 ? 0.5 : 1) * dt;
    b.cool -= dt;
    var by = player.y - (b.dist - distance);
    var blocked = [false, false, false];
    for (i = 0; i < entities.length; i++) {
      e = entities[i];
      if ((e.type !== 'veh' && e.type !== 'block') || e.fling) continue;
      g = by - e.y;                          // how far ahead of the rival it is
      if (g > -100 && g < b.look) blocked[e.lane] = true;
      if (Math.abs(e.x - b.x) < 46 && Math.abs(g) < (e.h + 96) / 2 - 10) {
        fling(e);                            // the rival bumped: it slows down for a moment
        b.slow = 1;
      }
    }
    if (blocked[b.lane] && b.cool <= 0) {
      var options = [];
      if (b.lane > 0 && !blocked[b.lane - 1]) options.push(b.lane - 1);
      if (b.lane < 2 && !blocked[b.lane + 1]) options.push(b.lane + 1);
      if (options.length) { b.lane = pick(options); b.cool = 0.25; }
    }
    b.x += (laneX(b.lane) - b.x) * Math.min(1, dt * 12);
  }

  function update(dt) {
    elapsed += dt;
    // Speed grows with every level, inside each level, and with every star collected.
    var base = mode === 'race'
      ? raceBase + raceBoost
      : 300 + Math.min(480, 45 * (cp + zoneProgress())) + starSpeed;
    if (slow > 0) slow = Math.max(0, slow - dt);
    speedMul += ((nitro > 0 ? 1.6 : (slow > 0 ? 0.5 : 1)) - speedMul) * Math.min(1, dt * 5);
    speed = base * speedMul;
    var dy = speed * dt;
    distance += dy;
    scrollScenery(dy);
    updateZones(dy);

    rowTimer -= dy;
    if (rowTimer <= 0) {
      spawnRow();
      rowTimer += 360 + (base - 300) * 0.6;
    }

    player.x += (laneX(player.lane) - player.x) * Math.min(1, dt * 16);
    updateCamera(dt);
    if (invincible > 0) invincible = Math.max(0, invincible - dt);
    if (shake > 0) shake = Math.max(0, shake - dt);
    if (magnet > 0) magnet = Math.max(0, magnet - dt);
    if (dbl > 0) dbl = Math.max(0, dbl - dt);
    var psx = player.x + offAt(player.y);
    if (nitro > 0) {
      nitro = Math.max(0, nitro - dt);
      if (nitro === 0) invincible = Math.max(invincible, 1.2); // a moment to settle after the boost
      if (Math.random() < dt * 40) {
        particles.push({ x: psx + rand(-10, 10), y: player.y + player.h / 2 + 8, vx: rand(-30, 30), vy: rand(120, 260),
          life: 0.35, max: 0.35, color: Math.random() < 0.5 ? '#ffd21f' : '#ff7a00', r: rand(3, 6), g: 0 });
      }
    }

    for (var i = entities.length - 1; i >= 0; i--) {
      var e = entities[i];
      e.y += dy;

      if (e.fling) {
        e.x += e.vx * dt;
        e.rot += e.spin * dt;
        if (e.x < -160 || e.x > W + 160 || e.y > H + 110) entities.splice(i, 1);
        continue;
      }

      if ((e.type === 'star' || e.type === 'gem') && magnet > 0 && e.y > player.y - 320 && e.y < player.y + 80) {
        e.x += (player.x - e.x) * Math.min(1, dt * 7);
        e.y += (player.y - e.y) * Math.min(1, dt * 2.5);
      }

      var hit = Math.abs(e.x - player.x) < (e.w + player.w) / 2 - 8 &&
                Math.abs(e.y - player.y) < (e.h + player.h) / 2 - 8;
      if (hit) {
        var ex = sx(e);
        if (e.type === 'star') {
          combo++;
          var pts = (10 + Math.min(combo - 1, 10)) * starMult * (dbl > 0 ? 2 : 1);
          bonus += pts;
          burst(ex, e.y, '#ffd21f', 10);
          popup(ex, e.y - 20, combo % 5 === 0 ? T('combo', { n: combo }) : '+' + pts);
          if (mode === 'race') raceBoost = Math.min(150, raceBoost + 6);
          else starSpeed = Math.min(160, starSpeed + 1.2);
          sndStar();
          entities.splice(i, 1);
          continue;
        }
        if (e.type === 'gem') {
          bonus += 50;
          burst(ex, e.y, '#7df9ff', 16);
          popup(ex, e.y - 20, '+50');
          sndGem();
          entities.splice(i, 1);
          continue;
        }
        if (e.type === 'pad') {
          bonus += 10;
          startNitro(1.2);
          popup(ex, e.y - 20, T('zoom'));
          entities.splice(i, 1);
          continue;
        }
        if (e.type === 'power') {
          burst(ex, e.y, POWER_INFO[e.ptype].color, 14);
          applyPower(e.ptype);
          entities.splice(i, 1);
          continue;
        }
        // Obstacles: traffic and things on the road
        if (nitro > 0) {
          fling(e);
          bonus += 5;
          popup(ex, e.y - 20, '+5');
          sndWhoosh();
          continue;
        }
        if (e.type === 'block' && squash) {
          burst(ex, e.y, '#ff7a00', 12);
          bonus += 5;
          popup(ex, e.y - 20, '+5');
          sndPop();
          entities.splice(i, 1);
          continue;
        }
        if (invincible <= 0) {
          if (shield) {
            shield = false;
            invincible = 1;
            fling(e);
            burst(psx, player.y, '#8fdcff', 16);
            sndPop();
            continue;
          }
          if (mode === 'race') { raceBump(e, i); continue; }
          loseHeart(e, i);
          if (hearts <= 0) {
            score = bonus + Math.floor(distance / 60);
            checkRecords();
            updateHud(false);
            endGame();
            return;
          }
          continue;
        }
      }
      if (e.y > H + 110) entities.splice(i, 1);
    }

    updateParticles(dt, dy);
    score = bonus + Math.floor(distance / 60);

    if (mode === 'race') {
      updateBot(dt);
      var nowAhead = distance >= bot.dist;
      if (nowAhead !== bot.playerAhead) {
        bot.playerAhead = nowAhead;
        showBanner(T(nowAhead ? 'passed' : 'overtaken'), false);
        if (nowAhead) sndPower(); else sndWhoosh();
      }
      if (distance >= raceLen || bot.dist >= raceLen) {      // somebody crossed the finish line
        raceResult = distance >= raceLen;
        if (raceResult && raceLevel > raceWon) {
          raceWon = raceLevel;
          save('zzc_race', raceWon);
        }
        updateHud(false);
        endGame();
        return;
      }
    }

    checkRecords();
    updateHud(false);
  }

  // ---------- Drawing helpers ----------
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }
  function fillRR(c, color, x, y, w, h, r) { c.fillStyle = color; rr(c, x, y, w, h, r); c.fill(); }
  function disc(c, color, x, y, r) { c.fillStyle = color; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
  function wheelPair(c, cx, y, ww, wh) {
    fillRR(c, '#1f2937', -cx - ww / 2, y, ww, wh, 4);
    fillRR(c, '#1f2937', cx - ww / 2, y, ww, wh, 4);
  }
  function outline(c) { c.lineWidth = 2; c.strokeStyle = 'rgba(0,0,0,0.25)'; c.stroke(); }
  function carLights(c, w, h, bright) {
    c.fillStyle = bright ? '#fff59d' : '#ffe0b2';
    rr(c, -w / 2 + 6, -h / 2 + 3, 12, 7, 3); c.fill();
    rr(c, w / 2 - 18, -h / 2 + 3, 12, 7, 3); c.fill();
    c.fillStyle = '#ff5252';
    rr(c, -w / 2 + 6, h / 2 - 9, 11, 5, 2); c.fill();
    rr(c, w / 2 - 17, h / 2 - 9, 11, 5, 2); c.fill();
  }
  function starPath(c, outer, inner) {
    c.beginPath();
    for (var i = 0; i < 10; i++) {
      var r = i % 2 === 0 ? outer : inner;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      if (i === 0) c.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    c.closePath();
  }
  var GLASS = '#cfefff';

  // ---------- Vehicles (drawn around 0,0, nose pointing up) ----------
  function drawVehicle(c, kind, color, bright) {
    var w = VEH[kind].w, h = VEH[kind].h, i;
    var top = -h / 2, bot = h / 2;

    if (kind === 'racer') {
      fillRR(c, 'rgba(0,0,0,0.2)', -14, top + 10, 36, h - 8, 10);
      wheelPair(c, w / 2 - 6, top + 16, 13, 24);
      wheelPair(c, w / 2 - 7, bot - 38, 15, 28);
      fillRR(c, '#1f2937', -w / 2 + 1, top, w - 2, 9, 3);          // front wing
      fillRR(c, '#1f2937', -w / 2 + 3, bot - 11, w - 6, 11, 3);    // rear wing
      fillRR(c, color, -19, -8, 38, 36, 9); outline(c);            // side pods
      fillRR(c, color, -11, top + 4, 22, h - 14, 10); outline(c);  // long nose and body
      fillRR(c, '#ffffff', -2.5, top + 8, 5, 30, 2);               // racing stripe
      fillRR(c, '#1f2937', -9, -6, 18, 26, 8);                     // cockpit
      disc(c, '#ffd21f', 0, 6, 7);                                 // helmet
      fillRR(c, '#1f2937', -5, 1, 10, 4, 2);
      return;
    }

    fillRR(c, 'rgba(0,0,0,0.2)', -w / 2 + 4, top + 6, w, h, 12);

    if (kind === 'car' || kind === 'taxi' || kind === 'gold') {
      var col = kind === 'taxi' ? '#ffcc00' : (kind === 'gold' ? '#ffc107' : color);
      wheelPair(c, w / 2 - 1, top + 12, 10, 22);
      wheelPair(c, w / 2 - 1, bot - 34, 10, 22);
      fillRR(c, col, -w / 2, top, w, h, 13); outline(c);
      if (kind === 'gold') {
        fillRR(c, '#ffe57a', -w / 2 + 4, top + 4, 10, h - 8, 5);     // shine
        fillRR(c, '#e53935', -4, top + 2, 8, h - 4, 2);              // champion stripe
      }
      fillRR(c, GLASS, -w / 2 + 8, top + 20, w - 16, 18, 6);
      fillRR(c, GLASS, -w / 2 + 10, bot - 26, w - 20, 12, 5);
      fillRR(c, 'rgba(255,255,255,0.22)', -w / 2 + 10, top + 42, w - 20, 20, 6);
      if (kind === 'taxi') {
        c.fillStyle = '#1f2937';
        for (i = 0; i < 6; i++) c.fillRect(-w / 2 + 3 + i * 8, i % 2 ? 22 : 18, 8, 4);
        fillRR(c, '#ffffff', -9, top + 46, 18, 11, 3);
        fillRR(c, '#1f2937', -5, top + 50, 10, 3, 1);
      }
      if (kind === 'gold') {
        c.save(); c.translate(0, top + 52); starPath(c, 9, 4); c.fillStyle = '#ffffff'; c.fill(); c.restore();
      }
      carLights(c, w, h, bright);
    } else if (kind === 'pickup') {
      wheelPair(c, w / 2 - 1, top + 14, 11, 23);
      wheelPair(c, w / 2 - 1, bot - 36, 11, 23);
      fillRR(c, color, -w / 2, top, w, h, 11); outline(c);
      fillRR(c, GLASS, -w / 2 + 8, top + 22, w - 16, 16, 5);
      fillRR(c, 'rgba(255,255,255,0.22)', -w / 2 + 9, top + 40, w - 18, 14, 5);
      fillRR(c, 'rgba(0,0,0,0.32)', -w / 2 + 6, top + 58, w - 12, h - 66, 4);   // cargo bed
      fillRR(c, '#c98b4a', -w / 2 + 11, top + 64, 14, 14, 2);                    // crates
      fillRR(c, '#e0a868', w / 2 - 27, top + 70, 16, 16, 2);
      carLights(c, w, h, bright);
    } else if (kind === 'monster') {
      wheelPair(c, w / 2 - 3, top + 4, 20, 32);
      wheelPair(c, w / 2 - 3, bot - 36, 20, 32);
      c.fillStyle = '#4b5563';
      for (i = 0; i < 4; i++) {
        c.fillRect(-w / 2 - 7, top + 8 + i * 7, 20, 2);
        c.fillRect(w / 2 - 13, top + 8 + i * 7, 20, 2);
        c.fillRect(-w / 2 - 7, bot - 32 + i * 7, 20, 2);
        c.fillRect(w / 2 - 13, bot - 32 + i * 7, 20, 2);
      }
      fillRR(c, color, -w / 2 + 11, top + 2, w - 22, h - 4, 11); outline(c);
      fillRR(c, GLASS, -w / 2 + 16, top + 24, w - 32, 15, 5);
      fillRR(c, GLASS, -w / 2 + 17, bot - 24, w - 34, 10, 4);
      fillRR(c, '#ffd21f', -9, top + 8, 6, 12, 2);                // hood stripes
      fillRR(c, '#ffd21f', 3, top + 8, 6, 12, 2);
      fillRR(c, 'rgba(255,255,255,0.22)', -w / 2 + 17, top + 43, w - 34, 22, 5);
      c.fillStyle = bright ? '#fff59d' : '#ffe0b2';
      c.fillRect(-w / 2 + 14, top + 3, 9, 5); c.fillRect(w / 2 - 23, top + 3, 9, 5);
      c.fillStyle = '#ff5252';
      c.fillRect(-w / 2 + 14, bot - 7, 9, 4); c.fillRect(w / 2 - 23, bot - 7, 9, 4);
    } else if (kind === 'superc') {
      wheelPair(c, w / 2 - 2, top + 14, 11, 22);
      wheelPair(c, w / 2 - 2, bot - 36, 12, 24);
      c.fillStyle = color;                                         // sleek wedge body
      c.beginPath();
      c.moveTo(-13, top + 2); c.quadraticCurveTo(0, top - 5, 13, top + 2);
      c.lineTo(w / 2 - 2, top + 28); c.lineTo(w / 2, bot - 14);
      c.quadraticCurveTo(w / 2, bot, w / 2 - 10, bot); c.lineTo(-w / 2 + 10, bot);
      c.quadraticCurveTo(-w / 2, bot, -w / 2, bot - 14); c.lineTo(-w / 2 + 2, top + 28);
      c.closePath(); c.fill(); outline(c);
      fillRR(c, '#ffd21f', -3, top + 3, 6, 24, 2);                 // lightning stripe
      fillRR(c, '#1f2937', -16, top + 30, 32, 34, 11);             // dark canopy
      fillRR(c, GLASS, -12, top + 33, 24, 10, 4);
      c.fillStyle = 'rgba(0,0,0,0.3)';
      c.fillRect(-11, bot - 27, 22, 3); c.fillRect(-11, bot - 21, 22, 3);
      fillRR(c, '#1f2937', -w / 2 + 2, bot - 10, w - 4, 9, 3);     // spoiler
      c.fillStyle = bright ? '#fff59d' : '#ffe0b2';
      c.fillRect(-w / 2 + 9, top + 13, 9, 5); c.fillRect(w / 2 - 18, top + 13, 9, 5);
    } else if (kind === 'rocket') {
      wheelPair(c, w / 2 - 6, top + 34, 9, 18);
      wheelPair(c, w / 2 - 6, bot - 40, 9, 18);
      c.fillStyle = '#1f2937';                                     // fins
      c.beginPath(); c.moveTo(-w / 2 + 6, bot - 36); c.lineTo(-w / 2 - 8, bot - 2); c.lineTo(-w / 2 + 8, bot - 8); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(w / 2 - 6, bot - 36); c.lineTo(w / 2 + 8, bot - 2); c.lineTo(w / 2 - 8, bot - 8); c.closePath(); c.fill();
      disc(c, '#ffb300', -8, bot + 5, 5); disc(c, '#ffb300', 8, bot + 5, 5);   // thruster glow
      disc(c, '#fff59d', -8, bot + 3, 2.5); disc(c, '#fff59d', 8, bot + 3, 2.5);
      c.fillStyle = color;                                         // pointed body
      c.beginPath();
      c.moveTo(0, top);
      c.quadraticCurveTo(w / 2 - 4, top + 18, w / 2 - 6, top + 42);
      c.lineTo(w / 2 - 6, bot - 8); c.quadraticCurveTo(w / 2 - 6, bot, w / 2 - 14, bot);
      c.lineTo(-w / 2 + 14, bot); c.quadraticCurveTo(-w / 2 + 6, bot, -w / 2 + 6, bot - 8);
      c.lineTo(-w / 2 + 6, top + 42);
      c.quadraticCurveTo(-w / 2 + 4, top + 18, 0, top);
      c.closePath(); c.fill(); outline(c);
      fillRR(c, '#ffffff', -w / 2 + 7, top + 48, w - 14, 7, 2);
      fillRR(c, '#ffffff', -w / 2 + 7, bot - 22, w - 14, 5, 2);
      disc(c, '#1f2937', 0, top + 30, 11);
      disc(c, GLASS, 0, top + 30, 8);
    } else if (kind === 'firetruck') {
      wheelPair(c, w / 2 - 1, top + 10, 10, 20);
      wheelPair(c, w / 2 - 1, top + 58, 10, 20);
      wheelPair(c, w / 2 - 1, bot - 30, 10, 20);
      fillRR(c, '#e53935', -w / 2, top, w, h, 9); outline(c);
      fillRR(c, GLASS, -w / 2 + 8, top + 9, w - 16, 13, 4);
      fillRR(c, '#29b6f6', -15, top + 26, 30, 7, 3);                // light bar
      fillRR(c, '#ffffff', -4, top + 26, 8, 7, 1);
      fillRR(c, '#b71c1c', -w / 2 + 7, top + 40, w - 14, h - 50, 4);
      fillRR(c, '#ffd21f', -w / 2 + 1, top + 40, 4, h - 50, 2);     // side stripes
      fillRR(c, '#ffd21f', w / 2 - 5, top + 40, 4, h - 50, 2);
      c.fillStyle = '#eceff1';                                      // ladder
      c.fillRect(-10, top + 44, 3, h - 58); c.fillRect(7, top + 44, 3, h - 58);
      for (i = 0; i < 7; i++) c.fillRect(-10, top + 47 + i * 9, 20, 2);
      carLights(c, w, h, bright);
    } else if (kind === 'van') {
      wheelPair(c, w / 2 - 1, top + 14, 10, 22);
      wheelPair(c, w / 2 - 1, bot - 36, 10, 22);
      fillRR(c, '#ffffff', -w / 2, top, w, h, 11); outline(c);
      fillRR(c, GLASS, -w / 2 + 8, top + 14, w - 16, 16, 5);
      fillRR(c, '#ff8fc0', -w / 2 + 2, top + 36, 7, h - 46, 3);   // pink stripes
      fillRR(c, '#ff8fc0', w / 2 - 9, top + 36, 7, h - 46, 3);
      c.fillStyle = '#e0a868';                                     // ice cream on the roof
      c.beginPath(); c.moveTo(-10, top + 58); c.lineTo(10, top + 58); c.lineTo(0, top + 88); c.closePath(); c.fill();
      disc(c, '#ff8fc0', 0, top + 54, 12);
      disc(c, '#ffffff', -4, top + 50, 3);
      carLights(c, w, h, bright);
    } else if (kind === 'truck') {
      wheelPair(c, w / 2 - 1, top + 10, 10, 20);
      wheelPair(c, w / 2 - 1, top + 62, 10, 20);
      wheelPair(c, w / 2 - 1, bot - 30, 10, 20);
      fillRR(c, color, -w / 2 + 3, top, w - 6, 36, 9); outline(c);          // cab
      fillRR(c, GLASS, -w / 2 + 10, top + 12, w - 20, 13, 4);
      fillRR(c, '#f1f3f5', -w / 2, top + 40, w, h - 40, 6); outline(c);     // trailer
      fillRR(c, color, -6, top + 46, 12, h - 52, 3);
      c.fillStyle = 'rgba(0,0,0,0.12)';
      for (i = 0; i < 3; i++) c.fillRect(-w / 2 + 3, top + 62 + i * 22, w - 6, 2);
      c.fillStyle = bright ? '#fff59d' : '#ffe0b2';
      c.fillRect(-w / 2 + 8, top + 2, 10, 5); c.fillRect(w / 2 - 18, top + 2, 10, 5);
      c.fillStyle = '#ff5252';
      c.fillRect(-w / 2 + 5, bot - 6, 11, 4); c.fillRect(w / 2 - 16, bot - 6, 11, 4);
    } else if (kind === 'bus') {
      wheelPair(c, w / 2 - 1, top + 16, 10, 22);
      wheelPair(c, w / 2 - 1, bot - 40, 10, 22);
      fillRR(c, '#ffb300', -w / 2, top, w, h, 10); outline(c);
      fillRR(c, GLASS, -w / 2 + 7, top + 10, w - 14, 15, 5);
      c.fillStyle = '#37474f';
      for (i = 0; i < 5; i++) {
        c.fillRect(-w / 2 + 3, top + 34 + i * 19, 5, 13);
        c.fillRect(w / 2 - 8, top + 34 + i * 19, 5, 13);
      }
      fillRR(c, '#ffe082', -12, top + 40, 24, 20, 4);            // roof hatches
      fillRR(c, '#ffe082', -12, top + 84, 24, 20, 4);
      fillRR(c, '#1f2937', -w / 2 + 6, bot - 5, w - 12, 3, 1);
      carLights(c, w, h, bright);
    }
  }

  // ---------- Things on the road ----------
  // Each land has its own kind of obstacle. Drawn around 0,0.
  function drawBlock(skin, seed) {
    var i;
    disc(ctx, 'rgba(0,0,0,0.2)', 3, 5, 20);
    switch (skin) {
      case 'cone':
        fillRR(ctx, '#ff7a00', -22, -22, 44, 44, 8);
        disc(ctx, '#ffffff', 0, 0, 15);
        disc(ctx, '#ff7a00', 0, 0, 10);
        disc(ctx, '#ffb066', 0, 0, 4);
        break;
      case 'tumble':
        disc(ctx, '#c79a5b', 0, 0, 20);
        ctx.strokeStyle = '#8a6532'; ctx.lineWidth = 2.5;
        for (i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(Math.cos(i * 1.3) * 5, Math.sin(i * 1.3) * 5, 8 + i * 2.2, i, i + 3.6); ctx.stroke(); }
        break;
      case 'snowball':
        disc(ctx, '#ffffff', 0, 0, 20);
        ctx.lineWidth = 2.5; ctx.strokeStyle = '#9cc4e4'; ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 13, 0.4, 2); ctx.stroke();
        disc(ctx, '#e6f3fb', -6, -6, 6);
        break;
      case 'ball':
        var bc = ['#ff5a5a', '#ffffff', '#ffd21f', '#ffffff', '#29b6f6', '#ffffff'];
        for (i = 0; i < 6; i++) {
          ctx.fillStyle = bc[i];
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 20, i * Math.PI / 3, (i + 1) * Math.PI / 3); ctx.closePath(); ctx.fill();
        }
        disc(ctx, '#ffffff', 0, 0, 4);
        break;
      case 'barrier':
        fillRR(ctx, '#ffffff', -24, -12, 48, 24, 5);
        ctx.fillStyle = '#ff7a00';
        for (i = 0; i < 4; i++) ctx.fillRect(-22 + i * 12, -10, 6, 20);
        disc(ctx, '#ffe14d', -18, -16, 5); disc(ctx, '#ffe14d', 18, -16, 5);
        break;
      case 'asteroid':
        ctx.fillStyle = '#9aa0b5';
        ctx.beginPath();
        for (i = 0; i < 9; i++) {
          var ar = 17 + ((i * 7) % 5);
          var aa = i * Math.PI * 2 / 9;
          if (i === 0) ctx.moveTo(Math.cos(aa) * ar, Math.sin(aa) * ar); else ctx.lineTo(Math.cos(aa) * ar, Math.sin(aa) * ar);
        }
        ctx.closePath(); ctx.fill();
        disc(ctx, '#7b8199', -6, -4, 5); disc(ctx, '#7b8199', 7, 5, 4); disc(ctx, '#7b8199', 3, -10, 2.5);
        break;
      case 'lavarock':
        disc(ctx, 'rgba(255,110,20,0.35)', 0, 0, 25);
        disc(ctx, '#2b2020', 0, 0, 19);
        ctx.strokeStyle = '#ff7a1f'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-12, -6); ctx.lineTo(-3, 0); ctx.lineTo(-6, 10); ctx.moveTo(-3, 0); ctx.lineTo(9, -5); ctx.lineTo(12, 6); ctx.stroke();
        break;
      case 'donut':
        ctx.lineWidth = 15; ctx.strokeStyle = '#e0a868';
        ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.stroke();
        ctx.lineWidth = 11; ctx.strokeStyle = '#ff7eb6';
        ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.stroke();
        var sc = ['#ffffff', '#ffd21f', '#29b6f6', '#7cdb6a'];
        for (i = 0; i < 8; i++) { ctx.fillStyle = sc[i % 4]; ctx.fillRect(Math.cos(i * 0.8) * 13 - 2, Math.sin(i * 0.8) * 13 - 1, 5, 2.5); }
        break;
    }
  }

  function drawStar(t) {
    ctx.rotate(Math.sin(t * 3) * 0.25);
    var s = 1 + Math.sin(t * 6) * 0.08;
    ctx.scale(s, s);
    starPath(ctx, 20, 9);
    ctx.fillStyle = (dbl > 0 || starMult > 1) ? '#fff36b' : '#ffd21f';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#e09b00';
    ctx.stroke();
  }

  function drawGem(t) {
    var s = 1 + Math.sin(t * 5) * 0.1;
    ctx.scale(s, s);
    disc(ctx, 'rgba(125,249,255,0.3)', 0, 0, 25);
    ctx.fillStyle = '#29d3e8';
    ctx.beginPath(); ctx.moveTo(0, -19); ctx.lineTo(16, -5); ctx.lineTo(0, 19); ctx.lineTo(-16, -5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#9af3ff';
    ctx.beginPath(); ctx.moveTo(0, -19); ctx.lineTo(16, -5); ctx.lineTo(-16, -5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-8, -7); ctx.lineTo(0, -16); ctx.lineTo(0, -7); ctx.closePath(); ctx.fill();
  }

  function drawPad(t) {
    fillRR(ctx, 'rgba(20,20,40,0.55)', -30, -30, 60, 60, 10);
    ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (var i = 0; i < 3; i++) {
      var ph = mod(t * 3 - i * 0.33, 1);
      ctx.strokeStyle = 'rgba(255,225,60,' + (0.35 + 0.65 * ph) + ')';
      var y = 16 - i * 14;
      ctx.beginPath(); ctx.moveTo(-16, y + 8); ctx.lineTo(0, y - 6); ctx.lineTo(16, y + 8); ctx.stroke();
    }
  }

  // Power-up badge, drawn around 0,0
  function drawPowerIcon(ptype) {
    disc(ctx, POWER_INFO[ptype].color, 0, 0, 20);
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.lineCap = 'butt';
    if (ptype === 'nitro') {
      ctx.fillStyle = '#fff36b';
      ctx.beginPath();
      ctx.moveTo(3, -13); ctx.lineTo(-8, 2); ctx.lineTo(-1, 2); ctx.lineTo(-3, 13);
      ctx.lineTo(8, -3); ctx.lineTo(1, -3); ctx.closePath(); ctx.fill();
    } else if (ptype === 'shield') {
      ctx.beginPath();
      ctx.moveTo(0, -12); ctx.lineTo(9, -8); ctx.lineTo(9, 0);
      ctx.quadraticCurveTo(9, 8, 0, 12); ctx.quadraticCurveTo(-9, 8, -9, 0);
      ctx.lineTo(-9, -8); ctx.closePath(); ctx.fill();
    } else if (ptype === 'magnet') {
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(-7, -9); ctx.lineTo(-7, 2); ctx.arc(0, 2, 7, Math.PI, 0, true); ctx.lineTo(7, -9);
      ctx.stroke();
      ctx.fillStyle = '#ffd21f';
      ctx.fillRect(-10, -11, 6, 5); ctx.fillRect(4, -11, 6, 5);
    } else if (ptype === 'heart') {
      ctx.beginPath();
      ctx.moveTo(0, 11);
      ctx.bezierCurveTo(-17, -1, -9, -15, 0, -5);
      ctx.bezierCurveTo(9, -15, 17, -1, 0, 11);
      ctx.fill();
    } else {
      ctx.font = 'bold 17px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('×2', 0, 1);
    }
  }

  // ---------- Scenery (drawn around 0,0) ----------
  function drawSceneItem(type, s) {
    var i;
    switch (type) {
      case 'tree':
        disc(ctx, 'rgba(0,0,0,0.15)', 3, 4, 16);
        disc(ctx, '#2e8b3d', 0, 0, 14 + s * 4);
        disc(ctx, '#48a956', -4, -4, 8);
        break;
      case 'bush':
        disc(ctx, '#3f9e4d', -6, 2, 9);
        disc(ctx, '#3f9e4d', 6, 3, 8);
        disc(ctx, '#58b865', 0, -3, 9);
        break;
      case 'flowers':
        var cols = ['#ff6fa5', '#ffffff', '#ffd21f'];
        for (i = 0; i < 3; i++) {
          var fx = (i - 1) * 11, fy = (i % 2) * 9 - 4;
          disc(ctx, cols[(i + Math.floor(s * 3)) % 3], fx, fy, 5);
          disc(ctx, '#ff9f1c', fx, fy, 2);
        }
        break;
      case 'cactus':
        fillRR(ctx, 'rgba(0,0,0,0.12)', -4, 12, 16, 6, 3);
        fillRR(ctx, '#3d9b4b', -5, -16, 10, 32, 5);
        fillRR(ctx, '#3d9b4b', -14, -6, 6, 14, 3);
        fillRR(ctx, '#3d9b4b', -14, 3, 12, 6, 3);
        fillRR(ctx, '#3d9b4b', 8, -11, 6, 13, 3);
        fillRR(ctx, '#3d9b4b', 3, -3, 11, 6, 3);
        disc(ctx, '#ff6fa5', 0, -16, 3);
        break;
      case 'rock':
        ctx.fillStyle = '#a58a6a';
        ctx.beginPath(); ctx.ellipse(0, 2, 15, 10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#c2a784';
        ctx.beginPath(); ctx.ellipse(-4, -1, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
        break;
      case 'pine':
        ctx.fillStyle = '#2f7d57';
        for (i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(0, -20 + i * 9); ctx.lineTo(-9 - i * 3, -6 + i * 10); ctx.lineTo(9 + i * 3, -6 + i * 10);
          ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-5, -12); ctx.lineTo(5, -12); ctx.closePath(); ctx.fill();
        ctx.fillRect(-7, -4, 14, 2);
        break;
      case 'snowman':
        disc(ctx, 'rgba(120,150,180,0.35)', 2, 10, 12);
        disc(ctx, '#ffffff', 0, 6, 11);
        ctx.lineWidth = 1.5; ctx.strokeStyle = '#b9cfe0'; ctx.stroke();
        disc(ctx, '#ffffff', 0, -9, 8);
        ctx.stroke();
        disc(ctx, '#1f2937', -3, -11, 1.4);
        disc(ctx, '#1f2937', 3, -11, 1.4);
        disc(ctx, '#ff7a00', 0, -8, 2);
        break;
      case 'palm':
        ctx.fillStyle = '#2fa35a';
        for (i = 0; i < 6; i++) {
          ctx.save();
          ctx.rotate(i * Math.PI / 3 + s * 2);
          ctx.beginPath(); ctx.ellipse(10, 0, 11, 4.5, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
        disc(ctx, '#8a5a2b', 0, 0, 5);
        break;
      case 'parasol':
        var pc = s < 0.5 ? '#ff5a5a' : '#29b6f6';
        for (i = 0; i < 8; i++) {
          ctx.fillStyle = i % 2 ? '#ffffff' : pc;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 15, i * Math.PI / 4, (i + 1) * Math.PI / 4); ctx.closePath(); ctx.fill();
        }
        disc(ctx, '#1f2937', 0, 0, 2);
        break;
      case 'boat':
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.moveTo(0, -17); ctx.quadraticCurveTo(11, -2, 8, 14); ctx.lineTo(-8, 14);
        ctx.quadraticCurveTo(-11, -2, 0, -17); ctx.fill();
        fillRR(ctx, s < 0.5 ? '#ff5a5a' : '#ffd21f', -5, -3, 10, 12, 3);
        break;
      case 'buoy':
        disc(ctx, '#ff5a5a', 0, 0, 9);
        disc(ctx, '#ffffff', 0, 0, 5);
        break;
      case 'wave':
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-14, 0); ctx.quadraticCurveTo(-7, -7, 0, 0); ctx.quadraticCurveTo(7, 7, 14, 0); ctx.stroke();
        break;
      case 'building':
        fillRR(ctx, '#151b30', -17, -22, 36, 46, 4);
        fillRR(ctx, '#3b4668', -19, -24, 36, 46, 4);
        for (i = 0; i < 6; i++) {
          var lit = ((i * 7 + Math.floor(s * 10)) % 3) !== 0;
          ctx.fillStyle = lit ? '#ffe98a' : '#222a45';
          ctx.fillRect(-14 + (i % 2) * 15, -18 + Math.floor(i / 2) * 13, 10, 8);
        }
        break;
      case 'lamp':
        disc(ctx, 'rgba(255,233,138,0.22)', 0, 0, 19);
        disc(ctx, 'rgba(255,233,138,0.4)', 0, 0, 11);
        disc(ctx, '#fff6c9', 0, 0, 5);
        break;
      case 'planet':
        var pcols = ['#ff8fc0', '#7bdff2', '#ffd21f', '#b388ff'];
        disc(ctx, pcols[Math.floor(s * 4) % 4], 0, 0, 12);
        disc(ctx, 'rgba(255,255,255,0.3)', -4, -4, 5);
        ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(0, 0, 19, 6, -0.4, 0, Math.PI * 2); ctx.stroke();
        break;
      case 'twinkle':
        var tw = 0.5 + 0.5 * Math.sin(clock * 3.3 + s * 20);
        ctx.globalAlpha = 0.4 + tw * 0.6;
        ctx.fillStyle = '#ffffff';
        for (i = 0; i < 3; i++) {
          ctx.save();
          ctx.translate((i - 1) * 12, ((i * 13 + s * 30) % 24) - 12);
          starPath(ctx, 5, 1.6);
          ctx.fill();
          ctx.restore();
        }
        ctx.globalAlpha = 1;
        break;
      case 'volcano':
        disc(ctx, '#5a3d33', 0, 0, 19);
        disc(ctx, '#6f4a3c', 0, 0, 13);
        disc(ctx, '#ff5a1f', 0, 0, 7 + Math.sin(clock * 4 + s * 9) * 1.2);
        disc(ctx, '#ffd21f', 0, 0, 3.5);
        break;
      case 'lavapool':
        ctx.fillStyle = '#ff5a1f';
        ctx.beginPath(); ctx.ellipse(0, 0, 17, 11, s * 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffb300';
        ctx.beginPath(); ctx.ellipse(-2, 0, 9, 5, s * 3, 0, Math.PI * 2); ctx.fill();
        break;
      case 'darkrock':
        ctx.fillStyle = '#231818';
        ctx.beginPath(); ctx.ellipse(0, 2, 14, 10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4a3636';
        ctx.beginPath(); ctx.ellipse(-4, -1, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
        break;
      case 'lollipop':
        fillRR(ctx, '#ffffff', -2, 4, 4, 20, 2);
        disc(ctx, s < 0.5 ? '#ff5c8a' : '#7b61ff', 0, -2, 14);
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(0, -2, 9, 0.5, 4.2); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, -2, 4, 3.4, 7); ctx.stroke();
        break;
      case 'cupcake':
        disc(ctx, '#e0a868', 0, 0, 15);
        disc(ctx, s < 0.5 ? '#ffffff' : '#9af3ff', 0, 0, 11);
        disc(ctx, '#ff7eb6', 0, 0, 7);
        disc(ctx, '#e53935', 0, 0, 3.5);
        break;
      case 'cane':
        for (i = 0; i < 6; i++) fillRR(ctx, i % 2 ? '#ffffff' : '#e53935', -4, -18 + i * 6, 8, 7, 2);
        break;
    }
  }

  // ---------- The road ----------
  function drawRoad() {
    var n = Math.ceil((H + STRIP) / STRIP), i, sy, off, z, wy;
    var zA = ZONES[zoneAbove], zB = ZONES[zoneBelow];
    function zoneFor(y) { return (transitioning && y < boundaryY) ? zA : zB; }

    // verges and tarmac
    for (i = 0; i < n; i++) {
      sy = i * STRIP;
      off = offAt(sy + STRIP / 2);
      stripOff[i] = off;
      z = zoneFor(sy);
      var l = ROAD_X + off, r = l + ROAD_W;
      if (l > 0) { ctx.fillStyle = z.left; ctx.fillRect(0, sy, l + 1, STRIP + 1); }
      if (r < W) { ctx.fillStyle = z.right; ctx.fillRect(r - 1, sy, W - r + 1, STRIP + 1); }
      ctx.fillStyle = z.road;
      ctx.fillRect(l, sy, ROAD_W, STRIP + 1);
    }
    // kerbs and lane dashes follow the road's own distance, so they scroll with it
    for (i = 0; i < n; i++) {
      sy = i * STRIP;
      off = stripOff[i];
      z = zoneFor(sy);
      wy = worldY(sy);
      var on = mod(wy, 80) < 40;
      if (on) {
        ctx.fillStyle = z.rainbow ? 'hsl(' + mod(Math.floor(wy / 80) * 55, 360) + ',95%,62%)' : z.kerbB;
      } else {
        ctx.fillStyle = z.kerbA;
      }
      ctx.fillRect(ROAD_X + off - 5, sy, 5, STRIP + 1);
      ctx.fillRect(ROAD_X + ROAD_W + off, sy, 5, STRIP + 1);
      if (on) {
        ctx.fillStyle = z.dash;
        ctx.fillRect(ROAD_X + LANE_W + off - 3, sy, 6, STRIP + 1);
        ctx.fillRect(ROAD_X + LANE_W * 2 + off - 3, sy, 6, STRIP + 1);
      }
    }
    if (transitioning) drawChecker(boundaryY, 2);
    if (mode === 'race' && state !== 'menu') {
      var fy = player.y - (raceLen - distance);     // the finish line
      if (fy > -40 && fy < H + 40) drawChecker(fy, 4);
    }
  }

  function drawChecker(y, rows) {
    var bo = offAt(y);
    for (var row = 0; row < rows; row++) {
      for (var i = 0; i < 30; i++) {
        ctx.fillStyle = (i + row) % 2 ? '#1f2937' : '#ffffff';
        ctx.fillRect(ROAD_X + bo + i * 10, y - rows * 5 + row * 10, 10, 10);
      }
    }
  }

  function outlinedText(text, x, y, size) {
    ctx.font = 'bold ' + size + 'px "Trebuchet MS", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(31,41,55,0.85)';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(text, x, y);
  }

  var RIVAL_COLOR = '#3d2c8d';
  function drawBot() {
    var by = player.y - (bot.dist - distance);
    var metres = Math.round(Math.abs(bot.dist - distance) / 30);
    if (by < -60) { outlinedText('▲ ' + T('rival') + ' ' + metres + ' m', W / 2, 128, 17); return; }
    if (by > H + 60) { outlinedText('▼ ' + T('rival') + ' ' + metres + ' m', W / 2, H - 70, 17); return; }
    var bx = bot.x + offAt(by);
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(angleAt(by) + (laneX(bot.lane) - bot.x) * 0.004);
    if (bot.slow > 0 && Math.floor(bot.slow * 10) % 2 === 1) ctx.globalAlpha = 0.5;
    drawVehicle(ctx, bot.kind, RIVAL_COLOR, true);
    ctx.restore();
    outlinedText(T('rival'), bx, by - 64, 14);
  }

  // Race progress: a little track with both cars and the finish flag
  function drawRaceBar() {
    var x0 = 84, x1 = W - 96, y = H - 30, i;
    fillRR(ctx, 'rgba(0,0,0,0.4)', x0 - 10, y - 10, x1 - x0 + 34, 20, 10);
    fillRR(ctx, '#ffffff', x0, y - 2, x1 - x0, 4, 2);
    for (i = 0; i < 6; i++) {
      ctx.fillStyle = (i + Math.floor(i / 2)) % 2 ? '#1f2937' : '#ffffff';
      ctx.fillRect(x1 + 4 + (i % 2) * 6, y - 9 + Math.floor(i / 2) * 6, 6, 6);
    }
    var bp = clamp(bot.dist / raceLen, 0, 1), pp = clamp(distance / raceLen, 0, 1);
    disc(ctx, RIVAL_COLOR, x0 + (x1 - x0) * bp, y, 6.5);
    ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    disc(ctx, CAR_COLORS[colorIndex], x0 + (x1 - x0) * pp, y, 8);
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#ffffff'; ctx.stroke();
  }

  // ---------- Weather ----------
  // Stronger at higher levels, and it builds up and calms down inside each land.
  function weatherStrength() {
    var byLevel = Math.min(1, 0.3 + 0.12 * ((mode === 'race' ? raceLevel : level) - 1));
    return byLevel * (0.35 + 0.65 * Math.sin(Math.PI * zoneProgress()));
  }

  function weatherType() {
    var z = ZONES[zoneNow];
    // after a full trip round all the lands, the meadow gets rain showers
    if (z.weather === 'petals' && cp >= seq.length) return 'rain';
    return z.weather;
  }

  function drawWeather(type, I, t) {
    var i, n, x, y, a, b, d;
    if (type === 'rain') {
      ctx.fillStyle = 'rgba(30,50,90,' + (0.16 * I) + ')';
      ctx.fillRect(0, 0, W, H);
      n = Math.floor(130 * I);
      ctx.strokeStyle = 'rgba(205,228,255,0.6)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath();
      for (i = 0; i < n; i++) {
        a = RN[i]; b = RN[i + 150]; d = RN[i + 300];
        x = mod(a * (W + 80) - t * 170, W + 80) - 20;
        y = mod(b * (H + 40) + t * (760 + 420 * d), H + 40) - 20;
        ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 16);
      }
      ctx.stroke();
    } else if (type === 'snow') {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.14 * I) + ')';
      ctx.fillRect(0, 0, W, H);
      n = Math.floor(140 * I) + 10;
      var wind = 30 + 320 * I * I;      // turns into a blizzard when it is strong
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.beginPath();
      for (i = 0; i < n; i++) {
        a = RN[i]; b = RN[i + 150]; d = RN[i + 300];
        x = mod(a * (W + 40) - t * wind * (0.6 + d) + Math.sin(t * 2 + i) * 8, W + 40) - 20;
        y = mod(b * (H + 20) + t * (150 + 160 * d), H + 20) - 10;
        ctx.moveTo(x + 3, y); ctx.arc(x, y, 1.5 + d * 2.2, 0, Math.PI * 2);
      }
      ctx.fill();
    } else if (type === 'sand') {
      ctx.fillStyle = 'rgba(224,180,98,' + (0.32 * I) + ')';
      ctx.fillRect(0, 0, W, H);
      n = Math.floor(80 * I) + 4;
      ctx.fillStyle = 'rgba(255,236,190,0.5)';
      for (i = 0; i < n; i++) {
        a = RN[i]; b = RN[i + 150]; d = RN[i + 300];
        x = mod(a * (W + 240) + t * (520 + 620 * d), W + 240) - 120;
        y = mod(b * H + t * 130 + Math.sin(t * 3 + i) * 10, H);
        ctx.fillRect(x, y, 26 + 60 * d, 2);
      }
    } else if (type === 'petals') {
      n = Math.floor(34 * I) + 6;
      for (i = 0; i < n; i++) {
        a = RN[i]; b = RN[i + 150]; d = RN[i + 300];
        x = mod(a * W + Math.sin(t * 1.4 + i) * 24 + t * 20, W + 20) - 10;
        y = mod(b * H + t * (70 + 60 * d), H + 20) - 10;
        ctx.fillStyle = i % 3 ? '#ffc1dc' : '#ffffff';
        ctx.beginPath(); ctx.ellipse(x, y, 4.5, 2.5, t * 2 + i, 0, Math.PI * 2); ctx.fill();
      }
    } else if (type === 'gulls') {
      n = 3 + Math.floor(5 * I);
      ctx.strokeStyle = 'rgba(40,60,80,0.4)'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (i = 0; i < n; i++) {
        a = RN[i]; b = RN[i + 150]; d = RN[i + 300];
        x = mod(a * (W + 80) + t * (50 + 60 * d), W + 80) - 40;
        y = mod(b * (H + 60) + t * 35, H + 60) - 30;
        var flap = Math.sin(t * 6 + i * 2) * 5;
        ctx.beginPath(); ctx.moveTo(x - 12, y - flap); ctx.lineTo(x, y + 3); ctx.lineTo(x + 12, y - flap); ctx.stroke();
      }
      // sun sparkles drifting across
      ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + 0.3 * I) + ')';
      for (i = 0; i < 10; i++) {
        a = RN[i + 40]; b = RN[i + 190];
        if (Math.sin(t * 3 + i * 1.7) > 0.3) {
          ctx.save(); ctx.translate(a * W, mod(b * H + t * 40, H)); starPath(ctx, 5, 1.5); ctx.fill(); ctx.restore();
        }
      }
    } else if (type === 'meteors') {
      n = 2 + Math.floor(7 * I);
      ctx.lineCap = 'round';
      for (i = 0; i < n; i++) {
        a = RN[i]; b = RN[i + 150]; d = RN[i + 300];
        var period = 2.2 + 2.5 * d;
        var cyc = Math.floor(t / period + a);
        var ph = mod(t / period + a, 1) / 0.4;
        if (ph < 1) {
          x = mod(b * W + cyc * 137, W + 100) - 100 + ph * 220;
          y = -30 + ph * (H * 0.9);
          ctx.strokeStyle = 'rgba(255,255,255,' + (0.85 * (1 - ph)) + ')';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 26, y - 70); ctx.stroke();
          disc(ctx, 'rgba(255,240,170,' + (1 - ph) + ')', x, y, 4);
        }
      }
    } else if (type === 'embers') {
      ctx.fillStyle = 'rgba(255,70,0,' + (0.1 * I) + ')';
      ctx.fillRect(0, 0, W, H);
      n = Math.floor(70 * I) + 8;
      for (i = 0; i < n; i++) {
        a = RN[i]; b = RN[i + 150]; d = RN[i + 300];
        x = mod(a * W + Math.sin(t * 2 + i) * 16, W);
        y = H - mod(b * H + t * (50 + 110 * d), H + 10);
        ctx.fillStyle = 'rgba(255,' + Math.floor(120 + 110 * d) + ',40,' + (0.5 + 0.5 * Math.sin(t * 8 + i)) + ')';
        ctx.beginPath(); ctx.arc(x, y, 1.5 + d * 2, 0, Math.PI * 2); ctx.fill();
      }
    } else if (type === 'sprinkles') {
      n = Math.floor(56 * I) + 10;
      for (i = 0; i < n; i++) {
        a = RN[i]; b = RN[i + 150]; d = RN[i + 300];
        x = mod(a * W + Math.sin(t + i) * 12, W);
        y = mod(b * H + t * (90 + 90 * d), H + 20) - 10;
        ctx.save();
        ctx.translate(x, y); ctx.rotate(t * 3 + i);
        ctx.fillStyle = 'hsl(' + ((i * 47) % 360) + ',90%,65%)';
        ctx.fillRect(-5, -1.5, 10, 3);
        ctx.restore();
      }
    }
  }

  // Celebration fireworks for a new high score
  function drawFireworks(t) {
    var since = t - fireworksAt;
    var loop = celebrating();
    if (!loop && (since < 0 || since > 4.5)) return;
    for (var k = 0; k < 6; k++) {
      var local = loop ? mod(t - k * 0.55, 3.3) : since - k * 0.55;
      if (local < 0 || local > 1.3) continue;
      var id = loop ? Math.floor((t - k * 0.55) / 3.3) * 6 + k : k;
      var cx = 50 + RN[mod(id * 13 + 7, 480)] * (W - 100);
      var cy = 110 + RN[mod(id * 29 + 3, 480)] * (H * 0.45);
      var p = local / 1.3;
      var rad = 85 * (1 - Math.pow(1 - p, 3));
      var hue = Math.floor(RN[mod(id * 17 + 11, 480)] * 360);
      ctx.fillStyle = 'hsla(' + hue + ',100%,68%,' + (1 - p) + ')';
      for (var j = 0; j < 16; j++) {
        var a = j * Math.PI / 8;
        ctx.beginPath(); ctx.arc(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad + p * p * 25, 3.5 - p * 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + Math.cos(a + 0.2) * rad * 0.55, cy + Math.sin(a + 0.2) * rad * 0.55 + p * p * 25, 2.5 - p * 1.5, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawTimers() {
    var list = [];
    if (nitro > 0) list.push(['nitro', nitro / nitroFull]);
    if (magnet > 0) list.push(['magnet', magnet / magnetDur]);
    if (dbl > 0) list.push(['dbl', dbl / dblDur]);
    if (shield) list.push(['shield', 1]);
    for (var i = 0; i < list.length; i++) {
      ctx.save();
      ctx.translate(W - 26 - i * 44, 84);
      disc(ctx, 'rgba(0,0,0,0.3)', 0, 0, 19);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, 0, 17, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(list[i][1], 0.001, 1));
      ctx.stroke();
      ctx.scale(0.62, 0.62);
      drawPowerIcon(list[i][0]);
      ctx.restore();
    }
  }

  function draw() {
    ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
    ctx.globalAlpha = 1;
    ctx.save();
    if (shake > 0 && state === 'playing') ctx.translate(rand(-4, 4), rand(-4, 4));

    var t = clock, i, e, s;
    drawRoad();

    for (i = 0; i < scenery.length; i++) {
      s = scenery[i];
      if (s.y < -40 || s.y > H + 40) continue;
      var off = offAt(s.y);
      var x = s.left ? ROAD_X - s.dist + off : ROAD_X + ROAD_W + s.dist + off;
      if (x < -30 || x > W + 30) continue;
      ctx.save();
      ctx.translate(x, s.y);
      drawSceneItem(s.type, s.s);
      ctx.restore();
    }

    var showPlayer = state !== 'menu';
    var psx = player.x + offAt(player.y);

    for (i = 0; i < entities.length; i++) {
      e = entities[i];
      if (e.y < -150) continue;
      ctx.save();
      ctx.translate(sx(e), e.y);
      if (e.type === 'star') drawStar(t + e.lane);
      else if (e.type === 'gem') drawGem(t + e.lane);
      else if (e.type === 'pad') { ctx.rotate(angleAt(e.y)); drawPad(t); }
      else if (e.type === 'power') {
        var ps = 1 + Math.sin(t * 6 + e.lane) * 0.1;
        disc(ctx, 'rgba(255,255,255,0.35)', 0, 0, 27 * ps);
        ctx.scale(ps, ps);
        drawPowerIcon(e.ptype);
      }
      else if (e.type === 'block') { if (e.rot) ctx.rotate(e.rot); drawBlock(e.skin, e.lane); }
      else {
        ctx.rotate(angleAt(e.y) + (e.rot || 0));
        drawVehicle(ctx, e.kind, e.color, false);
      }
      ctx.restore();
    }

    if (showPlayer && mode === 'race' && bot) drawBot();

    if (showPlayer) {
      var blink = invincible > 0 && state === 'playing' && Math.floor(invincible * 10) % 2 === 1;
      if (!blink) {
        ctx.save();
        ctx.translate(psx, player.y);
        ctx.rotate(angleAt(player.y) + (laneX(player.lane) - player.x) * 0.004);
        if (ZONES[zoneNow].dark) {              // headlight beams
          var g = ctx.createLinearGradient(0, -player.h / 2, 0, -player.h / 2 - 150);
          g.addColorStop(0, 'rgba(255,245,170,0.45)');
          g.addColorStop(1, 'rgba(255,245,170,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(-20, -player.h / 2 + 4); ctx.lineTo(20, -player.h / 2 + 4);
          ctx.lineTo(48, -player.h / 2 - 150); ctx.lineTo(-48, -player.h / 2 - 150);
          ctx.closePath(); ctx.fill();
        }
        if (nitro > 0) {
          var fl = rand(26, 44);
          ctx.fillStyle = '#ff7a00';
          ctx.beginPath(); ctx.moveTo(-12, player.h / 2 - 4); ctx.lineTo(12, player.h / 2 - 4); ctx.lineTo(0, player.h / 2 + fl); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#ffe14d';
          ctx.beginPath(); ctx.moveTo(-6, player.h / 2 - 4); ctx.lineTo(6, player.h / 2 - 4); ctx.lineTo(0, player.h / 2 + fl * 0.6); ctx.closePath(); ctx.fill();
        }
        drawVehicle(ctx, player.kind, CAR_COLORS[colorIndex], true);
        ctx.restore();
      }
      if (shield) {
        var pr = Math.max(player.h / 2 + 16, 64) + Math.sin(t * 5) * 2;
        disc(ctx, 'rgba(120,215,255,0.18)', psx, player.y, pr);
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(160,230,255,0.9)';
        ctx.stroke();
      }
      if (magnet > 0) {
        var mp = mod(t * 1.5, 1);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(206,147,216,' + (0.5 - mp * 0.5) + ')';
        ctx.beginPath(); ctx.arc(psx, player.y, 40 + mp * 60, 0, Math.PI * 2); ctx.stroke();
      }
    }

    // speed lines during nitro
    if (nitro > 0 && state === 'playing') {
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      for (i = 0; i < 9; i++) ctx.fillRect(rand(0, W), rand(0, H), 3, rand(40, 110));
    }

    if (showPlayer) drawWeather(weatherType(), weatherStrength(), t);

    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = clamp(p.life / p.max * 1.6, 0, 1);
      if (p.rect) { ctx.fillStyle = p.color; ctx.fillRect(p.x - p.r, p.y - p.r / 2, p.r * 2, p.r); }
      else disc(ctx, p.color, p.x, p.y, p.r);
    }
    ctx.globalAlpha = 1;

    drawFireworks(t);

    if (popups.length) {
      ctx.font = 'bold 20px "Trebuchet MS", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      for (i = 0; i < popups.length; i++) {
        ctx.globalAlpha = clamp(popups[i].life * 3, 0, 1);
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(31,41,55,0.85)';
        ctx.strokeText(popups[i].text, popups[i].x, popups[i].y);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(popups[i].text, popups[i].x, popups[i].y);
      }
      ctx.globalAlpha = 1;
    }

    ctx.restore();
    if (state === 'playing' || state === 'paused') {
      drawTimers();
      if (mode === 'race' && bot) drawRaceBar();
    }
  }

  // ---------- Main loop ----------
  function frame(now) {
    var dt = (now - lastTime) / 1000;
    lastTime = now;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;

    if (dt > 0 && state !== 'paused') {
      clock += dt;
      if (state === 'playing') {
        update(dt);
      } else if (state === 'menu') {
        distance += 90 * dt;
        scrollScenery(90 * dt);
        updateCamera(dt);
      } else if (state === 'over') {
        updateParticles(dt, 0);
        if (celebrating() && Math.random() < dt * 25) {   // confetti rain for a new best or a race win
          particles.push({ x: rand(0, W), y: -10, vx: rand(-40, 40), vy: rand(60, 160), life: 2.6, max: 2.6,
            color: 'hsl(' + Math.floor(rand(0, 360)) + ',95%,62%)', r: rand(3, 6), g: 120, rect: true });
        }
      }
    }
    pumpBanners(now);

    draw();
    window.requestAnimationFrame(frame);
  }

  // ---------- Go ----------
  muteBtn.textContent = muted ? '🔇' : '🔊';
  document.documentElement.lang = lang;
  document.title = T('title').replace('🚗 ', '');
  buildPickers();
  resetGame();
  showOverlay('menu');
  resize();
  window.requestAnimationFrame(function (now) {
    lastTime = now;
    window.requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
